<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>DBD Chat</title><style>
:root{--bg:#000;--panel:#0b0b0b;--panel2:#141414;--line:#252525;--text:#f5f5f5;--muted:#8e8e8e;--hover:#1b1b1b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial;overflow:hidden}.app{height:100vh;display:grid;grid-template-columns:270px 1fr}.side{background:#080808;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px}.brand{font-weight:800;font-size:20px;padding:10px 12px 16px}.new{border:1px solid #303030;background:#fff;color:#000;padding:11px 13px;border-radius:12px;font-weight:700;cursor:pointer}.search{margin:12px 0;padding:10px 12px;border:1px solid var(--line);background:#111;color:#fff;border-radius:10px;width:100%}.history{overflow:auto;flex:1}.conv{padding:10px;border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}.conv:hover,.conv.active{background:var(--hover)}.ct{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.x{opacity:0;background:none;border:0;color:#777;cursor:pointer}.conv:hover .x{opacity:1}.bottom{border-top:1px solid var(--line);padding-top:10px}.user{display:flex;align-items:center;gap:9px;padding:9px;border-radius:10px}.avatar{width:32px;height:32px;border-radius:50%;background:#222;display:grid;place-items:center;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.grow{flex:1;min-width:0}.name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.plan{font-size:11px;color:#aaa}.menu{display:grid;gap:4px;margin-top:5px}.menu button,.menu a{background:none;border:0;color:#aaa;text-align:left;padding:8px;border-radius:8px;text-decoration:none;cursor:pointer}.menu button:hover,.menu a:hover{background:#171717;color:#fff}.main{display:flex;flex-direction:column;min-width:0}.top{height:55px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.model{font-size:14px;font-weight:650}.tools button{border:1px solid var(--line);background:#101010;color:#ddd;border-radius:9px;padding:7px 10px;cursor:pointer}.chat{flex:1;overflow:auto}.messages{max-width:850px;margin:auto;padding:30px 20px 160px}.welcome{text-align:center;margin:15vh auto 40px;max-width:650px}.welcome h1{font-size:38px;margin:0 0 12px}.welcome p{color:var(--muted)}.msg{display:flex;gap:13px;margin:24px 0}.role{width:30px;height:30px;border-radius:50%;background:#171717;display:grid;place-items:center;font-size:13px;flex:none}.body{white-space:pre-wrap;line-height:1.6;min-width:0;overflow-wrap:anywhere}.user-msg .body{background:#151515;border-radius:16px;padding:11px 14px}.media{max-width:100%;max-height:520px;border-radius:14px;margin-top:10px}.composer-wrap{position:fixed;bottom:0;left:270px;right:0;background:linear-gradient(transparent,#000 25%);padding:35px 20px 20px}.composer{max-width:850px;margin:auto;border:1px solid #303030;background:#111;border-radius:20px;padding:9px 10px;display:flex;align-items:flex-end;gap:8px}.composer textarea{flex:1;resize:none;background:none;border:0;color:#fff;outline:0;min-height:45px;max-height:180px;padding:10px;font:inherit}.icon{border:0;background:#1b1b1b;color:#ddd;border-radius:10px;width:40px;height:40px;cursor:pointer}.send{background:#fff;color:#000;font-weight:800}.attach{font-size:18px}.hidden{display:none}.badge{font-size:10px;background:#fff;color:#000;border-radius:20px;padding:3px 6px}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:5}.modal.open{display:grid}.card{width:min(620px,calc(100% - 30px));background:#111;border:1px solid #2b2b2b;border-radius:18px;padding:20px;max-height:85vh;overflow:auto}.row{display:flex;gap:10px;align-items:center;margin:10px 0}.input,.select{width:100%;padding:11px;background:#181818;border:1px solid #333;color:#fff;border-radius:10px}.primary{background:#fff;color:#000;border:0;padding:10px 14px;border-radius:10px;font-weight:750}.danger{background:#250e0e;color:#fff;border:1px solid #5b2222;padding:10px 14px;border-radius:10px}.close{float:right;background:none;border:0;color:#aaa;font-size:22px}.feature-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.feature{background:#181818;border:1px solid #2a2a2a;border-radius:12px;padding:14px;cursor:pointer;color:#fff;text-align:left}.feature b{display:block;margin-bottom:5px}.muted{color:#888;font-size:13px}@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:4;width:280px;height:100vh;transform:translateX(-100%);transition:.2s}.side.open{transform:translateX(0)}.composer-wrap{left:0}.mobile{display:block!important}.messages{padding-left:13px;padding-right:13px}.welcome h1{font-size:30px}}.mobile{display:none;border:0;background:none;color:#fff;font-size:20px}.status{font-size:10px;color:#777;margin-left:6px;font-weight:500}.status.ok{color:#aaa}.status.bad{color:#ff7777}
</style></head><body><div class="app"><aside class="side" id="side"><div class="brand">DBD Chat</div><button class="new" onclick="newChat()">＋ Novo chat</button><input id="filter" class="search" placeholder="Pesquisar chats"><div id="history" class="history"></div><div class="bottom"><div class="user"><div class="avatar" id="avatar">D</div><div class="grow"><div class="name">{{username}}</div><div class="plan">{% if pro %}<span class="badge">PRO</span>{% else %}Grátis{% endif %}</div></div><button class="icon" onclick="openModal('settings')">⚙</button></div><div class="menu"><a href="/admin" {% if not admin %}style="display:none"{% endif %}>👑 Administrador</a><button onclick="logout()">↪ Sair</button></div></div></aside><main class="main"><div class="top"><button class="mobile" onclick="document.getElementById('side').classList.toggle('open')">☰</button><div class="model">DBD Chat <span class="muted">· IA</span> <span id="status" class="status">● a verificar</span></div><div class="tools"><button onclick="openModal('tools')">Ferramentas</button></div></div><div class="chat" id="chat"><div class="messages" id="messages"></div></div><div class="composer-wrap"><div class="composer"><button class="icon attach" onclick="document.getElementById('file').click()">＋</button><input id="file" type="file" class="hidden" accept=".png,.jpg,.jpeg,.webp,.gif,.pdf,.txt,.md,.csv,.docx,.mp3,.wav,.m4a,.mp4,.webm"><textarea id="prompt" placeholder="Mensagem para DBD Chat…"></textarea><button class="icon" onclick="voice()">🎙</button><button class="icon send" onclick="send()">↑</button></div><div style="text-align:center;color:#666;font-size:11px;margin-top:8px">A IA pode cometer erros. Verifica informações importantes.</div></div></main></div>
<div class="modal" id="settings"><div class="card"><button class="close" onclick="closeModal('settings')">×</button><h2>Configurações</h2><div class="row"><input id="setname" class="input" placeholder="Nome"><input id="setemail" class="input" placeholder="Email"></div><label>Idioma</label><select id="lang" class="select"><option value="pt">Português</option><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option></select><p><label><input type="checkbox" id="web"> Pesquisa na web</label></p><label>Instruções personalizadas</label><textarea id="custom" class="input" rows="5" placeholder="Como queres que a IA responda?"></textarea><div class="row"><button class="primary" onclick="saveSettings()">Guardar</button><button class="danger" onclick="changePassword()">Alterar senha</button></div></div></div>
<div class="modal" id="tools"><div class="card"><button class="close" onclick="closeModal('tools')">×</button><h2>Ferramentas DBD</h2><div class="feature-grid"><button class="feature" onclick="tool('image')"><b>🖼️ Imagem</b><span class="muted">Gerar imagens com IA</span></button><button class="feature" onclick="tool('video')"><b>🎬 Vídeo</b><span class="muted">Texto → vídeo</span></button><button class="feature" onclick="tool('animate')"><b>✨ Animar</b><span class="muted">Imagem → vídeo</span></button><button class="feature" onclick="tool('app')"><b>💻 Mini-app</b><span class="muted">Criar HTML funcional</span></button><button class="feature" onclick="tool('pdf')"><b>📄 PDF</b><span class="muted">Exportar texto</span></button><button class="feature" onclick="tool('docx')"><b>📝 DOCX</b><span class="muted">Exportar Word</span></button><button class="feature" onclick="shareCurrent()"><b>🔗 Partilhar</b><span class="muted">Criar link público</span></button></div></div></div>
<script>
let cid=null,attached=null,meData=null;const $=id=>document.getElementById(id);function openModal(id){$(id).classList.add('open')}function closeModal(id){$(id).classList.remove('open')}
async function api(url,opt={}){if(location.protocol==='file:')throw Error('DBD Chat está aberto como ficheiro. Abra-o através do servidor online (https://...) ou execute o servidor local.');let r;try{r=await fetch(url,opt)}catch(e){throw Error('Servidor DBD Chat não está acessível. Verifique a ligação e se o servidor está ligado.')}let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('Erro HTTP '+r.status));return d}
async function loadList(){let d=await api('/api/conversations');$('history').innerHTML=d.conversations.map(x=>`<div class="conv ${x.id==cid?'active':''}" onclick="loadChat(${x.id})"><span class="ct">${esc(x.title)}</span><button class="x" onclick="event.stopPropagation();delChat(${x.id})">×</button></div>`).join('')}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function loadChat(id){cid=id;let d=await api('/api/history?conversation_id='+id);$('messages').innerHTML='';if(!d.messages.length)welcome();for(let m of d.messages)add(m.role,m.text,m.attachment_name);await loadList();$('chat').scrollTop=$('chat').scrollHeight;$('side').classList.remove('open')}
function welcome(){ $('messages').innerHTML='<div class="welcome"><h1>Como posso ajudar?</h1><p>Conversa, pesquisa, ficheiros, código, imagens, vídeo, documentos e muito mais.</p></div>' }
function add(role,text,attachment){let w=document.createElement('div');w.className='msg '+(role==='user'?'user-msg':'');w.innerHTML=`<div class="role">${role==='user'?'U':'✦'}</div><div class="body">${esc(text||'')}${attachment?'<div class="muted">📎 '+esc(attachment)+'</div>':''}</div>`;$('messages').appendChild(w);return w}
async function newChat(){let d=await api('/api/conversations',{method:'POST'});cid=d.id;welcome();await loadList()}
async function delChat(id){await api('/api/conversations/'+id,{method:'DELETE'});if(id===cid){cid=null;await newChat()}else await loadList()}
async function send(){let text=$('prompt').value.trim();let f=$('file').files[0];if(!text&&!f)return;try{if(!cid)await newChat();let att=null;if(f){let fd=new FormData();fd.append('file',f);let r=await fetch('/api/upload',{method:'POST',body:fd});let j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw Error(j.error||'Falha no upload');att=j}$('prompt').value='';add('user',text,att?.name);let load=add('assistant','A pensar…');try{let d=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation_id:cid,message:text,attachment:att,web_search:meData?.settings?.web_search!==0})});load.remove();add('assistant',d.text);await loadList()}catch(e){load.remove();add('assistant','Erro: '+e.message)}finally{$('file').value='';$('chat').scrollTop=$('chat').scrollHeight}}catch(e){add('assistant','⚠️ '+e.message)}}
$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('filter').oninput=e=>document.querySelectorAll('.conv').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(e.target.value.toLowerCase())?'flex':'none');
async function tool(t){closeModal('tools');let prompt=window.prompt('Descreve o que queres criar:');if(!prompt)return;try{let opt={method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})};if(t==='pdf'||t==='docx'){let text=window.prompt('Texto para exportar:');let r=await fetch('/api/'+t,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});let b=await r.blob();let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dbd-documento.'+(t==='pdf'?'pdf':'docx');a.click();return}let d=await api('/api/'+t,opt);let m=add('assistant',t==='app'?'Mini-app criada.':t==='image'?'Imagem criada.':'Conteúdo criado.');if(d.url){let el=document.createElement(t==='video'||t==='animate'?'video':'img');el.src=d.url;el.className='media';if(el.tagName==='VIDEO')el.controls=true;m.querySelector('.body').appendChild(el)}}catch(e){alert(e.message)}}
async function shareCurrent(){if(!cid)return alert('Abre um chat primeiro.');try{let d=await api('/api/share/'+cid,{method:'POST'});await navigator.clipboard.writeText(d.url);alert('Link copiado!')}catch(e){alert(e.message)}}
async function saveSettings(){try{await api('/api/me',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('setname').value,email:$('setemail').value})});await api('/api/user-settings',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({language:$('lang').value,web_search:$('web').checked,custom_instructions:$('custom').value})});alert('Guardado.');closeModal('settings')}catch(e){alert(e.message)}}
async function changePassword(){let old=prompt('Senha atual:'),nw=prompt('Nova senha:');if(!old||!nw)return;try{await api('/api/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({old,new:nw})});alert('Senha alterada.')}catch(e){alert(e.message)}}
function voice(){if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window))return alert('O navegador não suporta reconhecimento de voz.');let R=window.SpeechRecognition||window.webkitSpeechRecognition,r=new R();r.lang='pt-PT';r.onresult=e=>$('prompt').value+=e.results[0][0].transcript;r.start()}
async function logout(){await api('/api/logout',{method:'POST'});location='/login'}
(async()=>{try{meData=await api('/api/me');$('status').textContent='● online';$('status').className='status ok';$('setname').value=meData.username||'';$('setemail').value=meData.email||'';$('lang').value=meData.settings?.language||'pt';$('web').checked=meData.settings?.web_search!==0;$('custom').value=meData.settings?.custom_instructions||'';if(meData.avatar)$('avatar').innerHTML='<img src="'+esc(meData.avatar)+'">';let d=await api('/api/conversations');if(d.conversations.length){cid=d.conversations[0].id;await loadChat(cid)}else await newChat()}catch(e){$('status').textContent='● servidor offline';$('status').className='status bad';$('messages').innerHTML='<div class="welcome"><h1>DBD Chat</h1><p style="color:#ff7777">'+esc(e.message)+'</p><p>Não abras o <b>index.html</b> diretamente pelo gestor de ficheiros. O DBD Chat precisa do servidor Flask para enviar mensagens.</p></div>';console.error(e)}})();
</script></body></html>
